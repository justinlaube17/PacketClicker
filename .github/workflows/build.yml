name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pygame==2.6.1 pyinstaller

      - name: Build .app with PyInstaller
        run: |
          pyinstaller \
            --windowed \
            --name "PacketClicker" \
            --add-data "bgm.ogg:." \
            --add-data "Packet_Clicker.mp3:." \
            packet_clicker.py

      - name: Zip .app
        run: |
          cd dist
          zip -r "../PacketClicker_macOS.zip" "PacketClicker.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketClicker-macOS
          path: PacketClicker_macOS.zip
          retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pygame==2.6.1 pyinstaller

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "PacketClicker" `
            --add-data "bgm.ogg;." `
            --add-data "Packet_Clicker.mp3;." `
            packet_clicker.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketClicker-Windows
          path: dist/PacketClicker.exe
          retention-days: 30

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: PacketClicker-Windows
          path: release/

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: PacketClicker-macOS
          path: release/

      - name: Publish latest release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest \
            release/PacketClicker.exe \
            release/PacketClicker_macOS.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Packet Clicker — Latest Build" \
            --notes "Automatisch gebaut vom neusten Commit. Windows: PacketClicker.exe · macOS: PacketClicker_macOS.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
